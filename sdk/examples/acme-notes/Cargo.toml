# @author kongweiguang
[package]
name = "kerminal-plugin-acme-notes"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "kerminal-plugin-sidecar"
path = "src/main.rs"

[dependencies]
serde_json = "1"
# 与宿主使用同一 reqwest/rustls 配对，避免示例引入第二套 TLS 栈。
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }

# 示例可以独立复制、构建和发布，不隐式加入放置目录外层的工作区。
[workspace]