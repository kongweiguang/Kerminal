# @author kongweiguang
name: GPUI native CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpui-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # macOS 全量构建与测试（含 WebView 探针）耗时明显长于其他平台：150 分钟窗口
    # 仍会在测试接近完成时被取消，GitHub 的 Intel runner 尤其慢，因此放宽到 300 分钟。
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macOS x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GitHub 托管的 ubuntu-22.04 镜像预装了 .NET、Android、GHC、CodeQL 等大量与本项目
      # 无关的 SDK，占用十余 GB 根盘空间。cargo xtask ci 的全量构建与测试会写满 runner，
      # 触发 "No space left on device"；这些目录在 Linux 任务中不会被用到，先删除腾出空间。
      - name: Free disk space on Linux runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/.ghcup \
            /opt/az \
            /usr/share/swift \
            /usr/local/share/chromium \
            /opt/microsoft/msedge \
            /opt/microsoft/powershell \
            /usr/lib/powershell || true
          df -h /

      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake pkg-config \
            libfontconfig1-dev libvulkan-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev \
            libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libegl1-mesa-dev libudev-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            xvfb dbus-x11

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: gpui-${{ matrix.target }}

      - name: Verify architecture, format, lint, and tests
        run: cargo xtask ci

      - name: Install SDK test runtime
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify generated SDK and browser contracts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix sdk/ts --no-audit --no-fund
          npm test --prefix sdk/ts
          node crates/kerminal-ui/tests/support/check_plugin_browser_sdk.mjs

      - name: Build plugin helper and acceptance entry points
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p kerminal-desktop -p kerminal-plugin-cli --features kerminal-desktop/acceptance,kerminal-desktop/acceptance-metrics,kerminal-desktop/right-rail-acceptance

      - name: Build and validate plugin examples
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc) platform=windows-x86_64; suffix=.exe ;;
            x86_64-unknown-linux-gnu) platform=linux-x86_64; suffix= ;;
            x86_64-apple-darwin) platform=macos-x86_64; suffix= ;;
            aarch64-apple-darwin) platform=macos-aarch64; suffix= ;;
            *) echo "Unsupported plugin platform" >&2; exit 1 ;;
          esac
          cli="target/debug/kerminal-plugin${suffix}"
          evidence="target/diagnostics/plugin-examples"
          mkdir -p "$evidence"
          for example in acme-notes http-check file-search; do
            project="sdk/examples/$example"
            output="$evidence/$example"
            mkdir -p "$output"
            # macOS 自带 bash 3.2 在 set -u 下展开空数组会报 unbound variable（bash 4.4 才修复），
            # 因此用 ${arr[@]+"${arr[@]}"} 只在数组非空时展开，acme-notes 的空 official 才不中断。
            official=()
            if [[ "$example" != acme-notes ]]; then official=(--official); fi
            "$cli" build --project "$project" --platform "$platform" ${official[@]+"${official[@]}"} 2>&1 | tee "$output/build.log"
            "$cli" check "$project/.kerminal/build" --platform "$platform" ${official[@]+"${official[@]}"} 2>&1 | tee "$output/check.log"
            if [[ "$example" == file-search ]]; then
              "$cli" conformance "$project/.kerminal/build/bin/file-search${suffix}" --id kerminal.file-search --version 1.0.0 2>&1 | tee "$output/conformance.log"
            fi
            "$cli" package --dir "$project/.kerminal/build" --out "$output" --platform "$platform" ${official[@]+"${official[@]}"} 2>&1 | tee "$output/package.log"
            packages=("$output"/*.kplugin)
            [[ ${#packages[@]} -eq 1 && -f "${packages[0]}" ]]
            "$cli" check "${packages[0]}" --platform "$platform" ${official[@]+"${official[@]}"} 2>&1 | tee "$output/package-check.log"
          done

      - name: Verify macOS WebView without desktop interaction
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          export KERMINAL_CONFIG_ROOT="${RUNNER_TEMP}/plugin-webview-config"
          # 探针只接受绝对路径，且要求输出目录在启动前不存在（见
          # crates/kerminal-desktop/src/webview_probe.rs 的 parse_options 校验），
          # 因此这里显式拼出工作区绝对路径，并在每个主题运行前清理自己的子目录；
          # 只删 webview-* 子目录，保留同目录下 plugin-examples 的验收产物。
          workspace="${GITHUB_WORKSPACE:-$PWD}"
          mkdir -p "$workspace/target/diagnostics"
          for theme in light dark system; do
            output="$workspace/target/diagnostics/webview-$theme"
            rm -rf "$output"
            target/debug/kerminal --webview-probe --headless-check --theme "$theme" --output "$output"
          done

      - name: Preserve native verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-native-${{ matrix.target }}
          path: target/diagnostics/
          if-no-files-found: ignore
