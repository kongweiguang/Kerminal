# @author kongweiguang
name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to validate; callers such as release must pass the resolved tag."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source, test, Rust, and build gates
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout validation ref
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 固定到上一版通过完整发布验证的工具链，避免 stable 更新改变门禁行为。
          toolchain: 1.98.1
          components: clippy,rustfmt

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: quality-linux-x64

      - name: Install Tauri build dependencies
        timeout-minutes: 25
        run: |
          set -euo pipefail

          # 尽量规避 runner 上 Azure 源间歇性阻塞：先把镜像源指向 archive，再保底重试。
          for file in \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources
          do
            if [ -f "$file" ]; then
              sudo sed -i \
                -e 's|https://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
                -e 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
                "$file"
            fi
          done

          if ! sudo apt-get \
            -o Acquire::Retries=4 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update
          then
            echo "::warning ::apt-get update failed, retrying without Azure 源。"
            for file in \
              /etc/apt/sources.list \
              /etc/apt/sources.list.d/*.list \
              /etc/apt/sources.list.d/*.sources
            do
              if [ -f "$file" ]; then
                sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$file"
              fi
            done
            sudo apt-get update
          fi

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            curl \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject moderate-or-higher production dependency advisories
        run: pnpm audit --prod --audit-level moderate --registry=https://registry.npmjs.org

      - name: Install RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked

      # rkyv 0.7 is only optional lockfile metadata from rust_decimal and is absent from every
      # target dependency graph. russh needs RSA SSH key compatibility, while RUSTSEC-2023-0071
      # has no patched rsa release and concerns private-key decryption rather than SSH signing.
      # Keeping the exceptions explicit means every other current or future advisory still fails CI.
      - name: Reject unreviewed RustSec vulnerabilities
        run: >-
          cargo audit --file src-tauri/Cargo.lock
          --ignore RUSTSEC-2026-0235
          --ignore RUSTSEC-2023-0071

      - name: Prepare source-size ratchet reference
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          reference_path="${RUNNER_TEMP}/source-size-reference.json"

          if [[ -z "${BASE_SHA}" ]] ||
            [[ "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)"
          fi

          if [[ -n "${BASE_SHA}" ]] &&
            git cat-file -e "${BASE_SHA}:scripts/source-size-baseline.json" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/source-size-baseline.json" \
              > "${reference_path}"
            echo "KERMINAL_SOURCE_SIZE_REFERENCE_BASELINE=${reference_path}" \
              >> "${GITHUB_ENV}"
            echo "Comparing source-size debt with ${BASE_SHA}."
          else
            echo "No reference baseline exists for this event;"
            echo "validating the current exact snapshot."
          fi

      - name: Run the shared quality entry
        run: pnpm run check

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: quality-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .updeng/docs/verification/source-size.json
            .updeng/docs/verification/frontend-architecture.json
            .updeng/docs/verification/eslint.json
            .updeng/docs/verification/dead-code.json
          retention-days: 14

  frontend-platform-focus:
    name: Frontend focus (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout validation ref
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck application and tests
        run: pnpm run typecheck

      - name: Typecheck test project
        run: pnpm run typecheck:test

      - name: Run terminal lifecycle regression tests
        run: >-
          pnpm exec vitest run
          tests/frontend/features/terminal/terminalDisposalCompatibility.test.ts
          tests/frontend/features/terminal/terminalRenderer.test.ts
          tests/frontend/features/terminal/terminalRuntimeSlots.test.ts
          tests/frontend/features/terminal/useTerminalRuntimePaneRetirement.test.tsx
          tests/frontend/features/terminal/TerminalPaneCard.test.tsx
          tests/frontend/features/terminal/TerminalWorkspace.runtimeOverlay.test.tsx
          tests/frontend/features/terminal/xterm-pane/XtermPane.lifecycle.test.tsx

      - name: Run bounded terminal disposal soak
        run: pnpm run verify:terminal-renderer-soak -- --duration-minutes 0.05

      - name: Build frontend
        env:
          # macOS ARM 的默认 V8 堆上限不足以完成当前 Monaco/xterm bundle，避免 CI 在构建阶段误报 OOM。
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build

  native-platform-check:
    name: Native check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout validation ref
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Windows native build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nasm strawberryperl -y --no-progress

      - name: Install macOS native build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: native-check-${{ matrix.os }}

      # Rust/Tauri dependencies have platform-specific branches.
      # Check both desktop targets before tagging to keep failures reversible.
      - name: Check native application and tests
        working-directory: src-tauri
        run: cargo check --all-targets --all-features
