<?xml version="1.0" encoding="UTF-8"?>
<!--
  Kerminal 应用图标精修预览，未接入正式打包资源。
  北极星：克制的深灰终端表面，让 >K 成为唯一的品牌主角。
  窗框与字标共用居中内容区，不再使用平台窗口控制点或装饰下划线。
  @author kongweiguang
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Kerminal 应用图标</title>
  <desc id="description">深灰圆角终端窗框内，居中的绿色渐变提示符与 K 字标，没有标题栏圆点和下划线。</desc>
  <defs>
    <linearGradient id="surface" x1="512" y1="32" x2="512" y2="992" gradientUnits="userSpaceOnUse">
      <stop stop-color="#242528"/>
      <stop offset="0.52" stop-color="#17181A"/>
      <stop offset="1" stop-color="#101012"/>
    </linearGradient>
    <linearGradient id="surface-edge" x1="512" y1="32" x2="512" y2="992" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="window-fill" x1="512" y1="170" x2="512" y2="854" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101012"/>
      <stop offset="1" stop-color="#141815"/>
    </linearGradient>
    <linearGradient id="brand" x1="270" y1="306" x2="770" y2="718" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5D6B8"/>
      <stop offset="0.48" stop-color="#8FC4A5"/>
      <stop offset="1" stop-color="#3D9D65"/>
    </linearGradient>
    <linearGradient id="frame" x1="190" y1="176" x2="830" y2="848" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8FC4A5"/>
      <stop offset="0.55" stop-color="#63A882"/>
      <stop offset="1" stop-color="#167344"/>
    </linearGradient>
    <linearGradient id="sheen" x1="512" y1="32" x2="512" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="32" y="32" width="960" height="960" rx="216"/>
    </clipPath>
    <filter id="window-shadow" x="120" y="126" width="784" height="784" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#surface)"/>
  <rect x="33" y="33" width="958" height="958" rx="215" stroke="url(#surface-edge)" stroke-width="2"/>
  <path d="M32 248C32 128.706 128.706 32 248 32H776C895.294 32 992 128.706 992 248V540H32V248Z" fill="url(#sheen)" clip-path="url(#tile)"/>

  <!-- 扩大主图形占比，减少底板留白；圆角与描边服务识别，不叠加玻璃质感。 -->
  <rect x="164" y="170" width="696" height="684" rx="92" fill="url(#window-fill)" filter="url(#window-shadow)"/>
  <rect x="170" y="176" width="684" height="672" rx="86" stroke="url(#frame)" stroke-width="12"/>

  <!-- 只保留很淡的终端语境线，避开放大后的字标并维持四边留白。 -->
  <path d="M222 276H290M734 276H802M222 748H290M734 748H802" stroke="#8FC4A5" stroke-opacity="0.075" stroke-width="5" stroke-linecap="round"/>

  <!-- >K 占据 254–770 × 306–718，保留至少 48 单位的框内安全区。 -->
  <path d="M282 386L418 512L282 638" stroke="url(#brand)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M530 334V690M530 512L742 334M530 512L742 690" stroke="url(#brand)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
