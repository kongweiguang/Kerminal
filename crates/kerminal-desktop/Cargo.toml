# @author kongweiguang
[package]
name = "kerminal-desktop"
default-run = "kerminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kerminal"
path = "src/main.rs"

[[bin]]
name = "kerminal-migrate"
path = "src/bin/kerminal-migrate.rs"

[features]
acceptance = ["kerminal-infrastructure/acceptance"]
acceptance-metrics = ["kerminal-ui/acceptance-metrics", "dep:windows"]
right-rail-acceptance = [
    "kerminal-ui/right-rail-acceptance",
    "dep:gpui_pre_windows",
    "gpui_pre_windows/test-support",
    "dep:async-trait",
    "dep:toml",
]

[dependencies]
zeroize.workspace = true
kerminal-plugin-protocol.workspace = true
async-trait = { workspace = true, optional = true }
gpui_kit.workspace = true
tokio-util.workspace = true
gpui_pre.workspace = true
dirs.workspace = true
kerminal-application.workspace = true
kerminal-domain.workspace = true
kerminal-infrastructure.workspace = true
kerminal-mcp.workspace = true
kerminal-ui.workspace = true
kerminal-terminal.workspace = true
tokio.workspace = true
single_application.workspace = true
sha2.workspace = true
sys_locale.workspace = true
tracing.workspace = true
tracing_appender.workspace = true
tracing_subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = { workspace = true, optional = true }
rfd.workspace = true

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }

[build-dependencies]
embed-resource = "=3.0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", optional = true, features = ["Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_System_WinRT", "Win32_System_WinRT_Graphics_Capture", "Win32_System_WinRT_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
gpui_pre_windows = { package = "gpui-pre-windows", path = "../../vendor/gpui-pre-windows", optional = true }
windows-sys = { workspace = true, features = ["Win32_UI_Shell", "Win32_System_StationsAndDesktops", "Win32_System_DataExchange", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

