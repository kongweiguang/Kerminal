# @author kongweiguang
[package]
name = "kerminal-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[features]
acceptance-metrics = ["gpui_kit/profiler"]
right-rail-acceptance = ["gpui_pre/test-support", "dep:gpui_component", "gpui_component/test-support"]

[dependencies]
kerminal-plugin-protocol.workspace = true
zeroize.workspace = true
chrono = { workspace = true, features = ["clock"] }
gpui_kit = { workspace = true, features = ["tree-sitter-languages"] }
gpui_pre.workspace = true
gpui_component = { package = "gpui-component", version = "=0.7.3", optional = true }
image.workspace = true
linkify.workspace = true
kerminal-application.workspace = true
kerminal-domain.workspace = true
kerminal-terminal.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio-util.workspace = true
url.workspace = true
uuid.workspace = true
unicode_segmentation.workspace = true
unicode_width.workspace = true

[target.'cfg(windows)'.dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com"] }
windows-core = "=0.62.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
wry = "=0.57.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
x11-dl = "=2.21.0"
webkit2gtk = "=2.0.2"
cairo-rs = { version = "=0.18.5", features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
# 快照调用直接使用这些类型；显式依赖与 Wry 锁定的 objc2 家族保持同一套版本。
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSImage", "NSView", "NSWindow", "objc2-quartz-core"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSError", "NSGeometry"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "WKSnapshotConfiguration"] }
image = { workspace = true, features = ["tiff"] }

[dev-dependencies]
# Headless tests exercise the selected GPUI backend without resolving Kit's optional fast backend.
async-trait.workspace = true
futures = { version = "0.3", default-features = false, features = ["executor"] }
gpui_pre = { workspace = true, features = ["test-support"] }
gpui_component = { package = "gpui-component", version = "=0.7.3", features = ["test-support"] }
tokio.workspace = true
toml.workspace = true

