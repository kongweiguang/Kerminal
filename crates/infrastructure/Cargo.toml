chacha20poly1305.workspace = true
chrono.workspace = true
dirs.workspace = true
fast-socks5.workspace = true
flate2.workspace = true
getrandom.workspace = true
image.workspace = true
kerminal-application.workspace = true
kerminal-domain.workspace = true
kerminal-terminal.workspace = true
keyring.workspace = true
justelnet_core.workspace = true
minisign_verify.workspace = true
notify_rust.workspace = true
notify.workspace = true
portable-pty.workspace = true
process-wrap.workspace = true
rfd.workspace = true
rusqlite.workspace = true
russh.workspace = true
russh_sftp.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
